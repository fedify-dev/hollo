packages:
- .
- docs

allowBuilds:
  argon2: true
  esbuild: true
  sharp: true

overrides:
  fast-xml-parser@<4.5.5: ^4.5.5
  fast-xml-parser@>=5.0.0 <5.7.0: ^5.7.0

minimumReleaseAgeExclude:
- '@fedify/*'
- srvx@1.0.6

permissions:
  '@fedify/fedify':
    skills: true
  '@logtape/logtape':
    skills: true
  '@sacho/sacho':
    skills: true
  drizzle-kit:
    skills: true

skills:
  dirs:
  - .agents/skills
