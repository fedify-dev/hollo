packages:
- .
- docs

allowBuilds:
  argon2: true
  esbuild: true
  sharp: true

overrides:
  fast-xml-parser@<4.5.5: ^4.5.5
  fast-xml-parser@>=5.0.0 <5.7.0: ^5.7.0

minimumReleaseAgeExclude:
- '@fedify/*'
- srvx@1.0.7
- '@mdit/helper@1.1.3'
- '@mdit/plugin-ruby@1.1.3'
- '@gukhanmun/loanwords-fst@0.3.0'
- '@gukhanmun/napi-aarch64-apple-darwin@0.3.0'
- '@gukhanmun/napi-aarch64-pc-windows-msvc@0.3.0'
- '@gukhanmun/napi-aarch64-unknown-linux-gnu@0.3.0'
- '@gukhanmun/napi-x86_64-apple-darwin@0.3.0'
- '@gukhanmun/napi-x86_64-pc-windows-msvc@0.3.0'
- '@gukhanmun/napi-x86_64-unknown-linux-gnu@0.3.0'
- '@gukhanmun/napi@0.3.0'
- '@gukhanmun/opendict-fst@0.3.0'
- '@gukhanmun/stdict-fst@0.3.0'

permissions:
  '@fedify/fedify':
    skills: true
  '@logtape/logtape':
    skills: true
  '@sacho/sacho':
    skills: true
  drizzle-kit:
    skills: true

skills:
  dirs:
  - .agents/skills
