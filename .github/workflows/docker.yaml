name: docker

on:
  pull_request:
    paths:
      - .dockerignore
      - .github/workflows/docker.yaml
      - Dockerfile
      - mise.toml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_dispatch:

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          build-args: VERSION=ci
          push: false
      - name: Build ARM64 toolchain
        uses: docker/build-push-action@v5
        with:
          platforms: linux/arm64
          push: false
          target: toolchain
