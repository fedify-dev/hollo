[tools]
node = "24"
pnpm = "11.21.0"

[tools."github:dahlia/hongdown"]
version = "0.5.1"

[tools."github:dahlia/hongdown".platforms]
linux-x64 = "hongdown-*-x86_64-unknown-linux-musl.tar.bz2"
linux-arm64 = "hongdown-*-aarch64-unknown-linux-musl.tar.bz2"

[hooks]
postinstall = "pnpm install"

[tasks.fmt]
depends = ["fmt:pnpm", "fmt:md"]

[tasks."fmt:pnpm"]
run = "pnpm run fmt"

[tasks."fmt:md"]
run = "hongdown --write"

[tasks.check]
depends = ["check:pnpm-version", "check:pnpm", "check:md"]

[tasks."check:ci"]
depends = ["check:pnpm-version", "check:pnpm:ci", "check:md"]

[tasks."check:pnpm-version"]
run = """
expected="$(node -p 'require("./package.json").packageManager.split("@")[1].split("+")[0]')"
actual="$(mise current pnpm)"
if [ "$actual" != "$expected" ]; then
  echo "pnpm version mismatch: mise.toml has $actual, package.json has $expected" >&2
  exit 1
fi
"""

[tasks."check:pnpm"]
run = "pnpm run check"

[tasks."check:pnpm:ci"]
run = "pnpm run check:ci"

[tasks."check:md"]
run = "hongdown --check"
