[tools]
"aqua:dahlia/hongdown" = "0.5.3"
"github:dahlia/sacho" = "0.3.2"
node = "24"
pnpm = "12.11.2"

[hooks]
postinstall = """
pnpm install
sacho init --no-interactive --install-hook \
  || echo "warning: failed to install Sacho Git hooks; see AGENTS.md" >&2
"""

[tasks.fmt]
depends = ["fmt:pnpm", "fmt:changes", "fmt:md"]

[tasks."fmt:pnpm"]
run = "pnpm run fmt"

[tasks."fmt:changes"]
run = "sacho sync --force && sacho fmt"

[tasks."fmt:md"]
depends = ["fmt:changes"]
run = "hongdown --write"

[tasks.check]
depends = ["check:pnpm-version", "check:pnpm", "check:changes", "check:md"]

[tasks."check:ci"]
depends = ["check:pnpm-version", "check:pnpm:ci", "check:changes", "check:md"]

[tasks."check:pnpm-version"]
run = """
expected="$(node -p 'require("./package.json").packageManager.split("@")[1].split("+")[0]')"
actual="$(mise current pnpm)"
if [ "$actual" != "$expected" ]; then
  echo "pnpm version mismatch: mise.toml has $actual, package.json has $expected" >&2
  exit 1
fi
"""

[tasks."check:pnpm"]
run = "pnpm run check"

[tasks."check:pnpm:ci"]
run = "pnpm run check:ci"

[tasks."check:changes"]
run = "sacho check"

[tasks."check:md"]
run = "hongdown --check"

[tasks.bump-version]
description = "Set the version being prepared in package.json and CHANGES.md"
usage = 'arg "<version>" help="Version to prepare, such as 1.2.3"'
run = """
node -e '
const fs = require("node:fs");
const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
pkg.version = process.argv[1];
fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\\n");
' "$usage_version"
sacho next "$usage_version"
"""
